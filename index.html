<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F1EE">
<title>Quarto de Guerra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: terna, delicada, acolhedora — um lugar secreto, não um painel.
   IDEA: o quarto de oração: uma janela em arco por onde entra luz suave.
   PICTURE: o arco de luz (login) e o cartão da campanha com o arco em traço fino.
   COLOUR and TYPE: rosé antigo + champanhe sobre porcelana; Plus Jakarta Sans, serifa itálica só nos versículos.
   LAYOUT: app de uma coluna, cartões arredondados, navegação inferior em vidro. */
:root{color-scheme:light dark;
--bg:light-dark(#F8F1EE,#1F181B);--card:light-dark(#FFFFFF,#2B2226);--ink:light-dark(#3F3236,#F3E8EA);
--muted:light-dark(#76666B,#C2B0B5);--line:light-dark(#EDE0DC,#3D3236);--rose:light-dark(#9A5F6E,#E2B3BF);
--rose-ink:light-dark(#FFFFFF,#2A1D22);--rose-soft:light-dark(#F3E3E5,#3A2A30);--champ:light-dark(#F1E4D6,#3A3029);
--sage:light-dark(#4F6E55,#A9C8AE);--sage-soft:light-dark(#E5EEE4,#26332A);--shadow:light-dark(rgba(154,95,110,.08),rgba(0,0,0,.25))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:28px 20px 112px}
h1{font-size:30px;line-height:1.1;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px var(--shadow)}
.verso{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:21px;line-height:1.35;color:var(--rose)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--rose);color:var(--rose-ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;width:100%}
.btn.soft{background:var(--rose-soft);color:var(--rose)}
.btn.line{background:transparent;border:1.5px solid var(--rose);color:var(--rose)}
.btn.small{min-height:44px;font-size:14px;width:auto;padding:0 18px}
.link{background:none;border:0;color:var(--rose);font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input,textarea,select{width:100%;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;min-height:50px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--rose-soft);color:var(--rose);white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--sage)}
.chip.off{background:var(--champ);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--rose);border-radius:3px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(140deg,var(--rose-soft),var(--champ));border:1px solid var(--line)}
.hero .arch{position:absolute;right:-18px;bottom:-10px;width:150px;opacity:.55;pointer-events:none}
.hero>*:not(.arch){position:relative}
.eyebrow{font-size:12px;font-weight:600;color:var(--rose)}
.dots{display:flex;gap:6px}.dots span{width:11px;height:11px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--rose)}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:17px;cursor:pointer;flex:none}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;min-height:64px}
.item b{font-weight:600;display:block}.item .muted{font-size:13px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--rose)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--rose-soft);color:var(--rose);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.day.done{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}.day.today{outline:2px solid var(--rose);outline-offset:1px}.day:disabled{cursor:default;opacity:.45}
.carta p{margin-bottom:14px;font-size:17px;line-height:1.7}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(456px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 12px 30px var(--shadow);z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;min-height:54px;justify-content:center}
nav.tabs a.on{color:var(--rose);background:var(--rose-soft);font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(40,25,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:min(480px,100%);border-radius:26px;padding:22px;max-height:88vh;overflow:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{width:max-content;max-width:90%;text-align:center;position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.demo{font-size:12px;text-align:center;color:var(--muted);background:var(--champ);border-radius:999px;padding:6px 12px}
.login{min-height:calc(100vh - 56px);display:flex;flex-direction:column;gap:22px;justify-content:center}
.login .pic{width:100%;max-width:260px;margin:0 auto;display:block}
.brand{text-align:center;display:flex;flex-direction:column;gap:8px}
.brand h1{font-size:34px;font-weight:300;letter-spacing:.02em}.brand h1 b{font-weight:600}
.block{border-radius:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line)}
.block.rose{background:var(--rose-soft);border-color:transparent}
.block.champ{background:var(--champ);border-color:transparent}
.block h3{font-size:14px;font-weight:700;margin:0 0 6px;color:var(--rose)}
.read{font-size:17px;line-height:1.7}
ol.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary svg{transform:rotate(90deg)}
.breath{width:180px;height:180px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,var(--card),var(--rose-soft));border:1px solid var(--rose);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--rose);animation:breath 10s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.7)}40%{transform:scale(1)}100%{transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden></nav>
<div class="overlay" id="overlay"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
{
/* ===== CONFIGURAÇÃO (passo 2: login real com Supabase + Kiwify) ===== */
const CONFIG={supabaseUrl:'',supabaseAnonKey:'',checkoutUrl:''};
const DEMO=!CONFIG.supabaseUrl;

/* ===== CONTEÚDO DAS CAMPANHAS =====
   Cada dia: r referência · t título · p a Palavra · d direcionamento da Vanessa · e olhar emocional
   x exercício (título) · xs passos do exercício · o oração estratégica · c desafio de hoje · g perguntas do registro no secreto */
const D=(r,t,p,d,e,x,xs,o,c,g)=>({r,t,p,d,e,x,xs,o,c,g});
/* N(ref, título, Palavra, direcionamento, olhar da psicanálise, o que acontece no cérebro, exercício, passos, âncora: quando, gesto, frase, oração, desafio, perguntas do registro) */
const N=(r,t,p,d,e,n,x,xs,q,s,f,o,c,g)=>({r,t,p,d,e,n,x,xs,a:{q,s,f},o,c,g});
const NEEMIAS={id:'neemias',mes:'Novembro',inicio:'2026-11-20',frente:'Emoções',
titulo:'Neemias: reconstruindo os muros',
resumo:'21 dias para reconstruir por dentro o que foi derrubado: emoções, limites, casa e fé. Palavra, psicanálise, neuropsicanálise e prática em cada dia.',
dias:[
N('Neemias 1.1-3','Coragem de olhar para os muros','Neemias perguntou como estava Jerusalém, e a resposta doeu: os muros estavam derrubados e as portas, queimadas. A reconstrução não começou com tijolos, começou com uma pergunta honesta. Quem não pergunta como estão os seus muros nunca reconstrói nada.','Hoje você vai parar de dizer "está tudo bem". Você vai olhar, com Deus ao seu lado, para cada área da sua vida e reconhecer o que está de pé e o que está em ruínas. Sem drama e sem disfarce: só a verdade.','A psicanálise chama de negação a defesa que nos protege de ver o que dói. Ela tem uma função: nos deixa funcionar no dia a dia. Mas aquilo que não é olhado continua agindo por baixo, em forma de cansaço, irritação, choro sem motivo aparente. O que não é nomeado se repete.','O cérebro foi feito para proteger você da dor e, por isso, desvia a atenção do que ameaça. É um mecanismo de sobrevivência, não falta de fé. Olhar de forma intencional e segura é o que permite ao cérebro sair do modo de fuga e começar a organizar a experiência.','Inventário dos muros',['Escreva estas áreas: emoções, casamento ou vida afetiva, filhos, finanças, corpo e saúde, fé, amizades.','Dê uma nota de 0 a 10 para como cada muro está hoje. Seja honesta, ninguém vai ver.','Nas duas notas mais baixas, escreva: "O que eu tenho evitado olhar aqui é..."','Escreva desde quando esse muro está assim. Datas e acontecimentos ajudam a mente a organizar.','Leia a lista em voz alta diante de Deus. Não peça nada ainda: apenas mostre a Ele.'],'Sempre que você se pegar dizendo "está tudo bem" sem estar','Mão aberta sobre o peito','"Senhor, eu quero ver com os Teus olhos."','Senhor, eu paro de fingir diante de Ti. Tu já conheces os meus muros derrubados e as minhas portas queimadas. Eu Te mostro cada área da minha vida como ela está hoje. Dá-me coragem para olhar e fé para crer que nada do que eu Te entregar ficará em ruínas.','Diga a verdade sobre como você está a uma pessoa de confiança hoje, nem que seja em uma frase.',['Qual muro eu tenho evitado olhar e por quê?','O que eu senti ao dar nota para cada área?','O que eu espero que Deus reconstrua nestes 21 dias?']),
N('Neemias 1.4','Chorar antes de construir','Ao ouvir a notícia, Neemias se sentou, chorou e lamentou por alguns dias, jejuando e orando. Um homem de fé, que depois liderou uma grande obra, começou chorando. O luto veio antes da construção.','Hoje você vai se permitir sentir o que perdeu. Não vai pular para a solução. Lágrimas não atrasam a reconstrução: elas preparam o terreno.','Freud mostrou que toda perda precisa de um trabalho de luto: reconhecer o que se foi, sentir a dor e, aos poucos, desligar-se do que não volta. Quando o luto não é vivido, ele vira um peso sem nome, uma tristeza que se arrasta. Muitas mulheres carregam lutos nunca chorados: um sonho, uma fase, uma versão de si mesmas, um relacionamento.','Expressar a emoção, em vez de segurá-la, ajuda o corpo a sair do estado de tensão e voltar ao equilíbrio. Chorar faz parte dos recursos naturais de autorregulação. Segurar o choro por muito tempo mantém o organismo em alerta.','Carta de luto',['Escreva uma perda que você nunca se permitiu chorar: pode ser uma pessoa, um sonho, uma fase da vida ou uma versão de você.','Comece uma carta assim: "Eu sinto falta de..." e escreva sem corrigir.','Escreva o que essa perda levou de você e o que ela deixou.','Termine com: "Senhor, eu Te entrego esta perda. Eu não preciso mais carregá-la sozinha."','Se o choro vier, deixe vir. Respire devagar e permaneça na presença de Deus.'],'Quando uma tristeza antiga aparecer sem avisar','As duas mãos juntas, palmas para cima','"Tu recolhes as minhas lágrimas, Senhor." (Salmo 56.8)','Pai, eu me sento diante de Ti como Neemias. Eu choro pelo que foi derrubado na minha vida e pelo que eu perdi pelo caminho. Recebe as minhas lágrimas. Consola o meu coração e transforma este luto em terreno firme para a reconstrução que Tu vais fazer.','Separe 10 minutos sozinha hoje para ficar em silêncio com Deus, sem celular, sem tarefas.',['Qual perda eu nunca tinha chorado?','O que eu senti ao escrever a carta?','O que essa perda me ensinou sobre mim?']),
N('Neemias 1.5-7','Responsabilidade sem autoacusação','Neemias confessou: "eu e a casa de meu pai pecamos". Ele assumiu a parte dele e da sua família, sem se esconder e sem se destruir. Ele confessou diante de um Deus que guarda a aliança e é misericordioso.','Hoje você vai separar duas coisas que muitas mulheres confundem: culpa e responsabilidade. A culpa paralisa e acusa. A responsabilidade reconhece e se move.','Na psicanálise, o superego é a instância que julga e cobra. Quando ele é muito severo, vira uma voz que acusa o tempo todo, e a pessoa vive pedindo desculpas por existir. A confissão bíblica é diferente: ela reconhece o erro diante de um Deus que perdoa, e por isso liberta, em vez de aprisionar.','A autocrítica constante ativa no cérebro os mesmos circuitos de ameaça que um perigo externo. É como viver com um inimigo dentro de casa. Já uma postura de compaixão consigo mesma ativa circuitos de cuidado e segurança, que favorecem a mudança.','Culpa ou responsabilidade?',['Escreva três coisas pelas quais você se culpa com frequência.','Ao lado de cada uma, pergunte: isto foi mesmo minha escolha? O que estava ao meu alcance?','Separe em duas colunas: "o que é responsabilidade minha" e "o que eu carrego, mas não é meu".','Para cada responsabilidade real, escreva um passo concreto de reparação.','Para o que não é seu, escreva: "Eu devolvo isto. Não é meu para carregar."'],'Quando a voz de acusação começar a falar dentro de você','Respirar fundo e soltar os ombros','"Não há condenação para os que estão em Cristo." (Romanos 8.1)','Deus fiel, eu reconheço os meus erros diante de Ti, sem esconder e sem me destruir. Obrigada porque a Tua misericórdia é maior do que a minha culpa. Tira de mim o que não é meu para carregar e dá-me coragem para reparar o que for meu.','Faça hoje um gesto de reparação concreto por algo que é responsabilidade sua: um pedido de perdão, uma conversa, uma atitude.',['De que eu me culpava que não era meu?','Qual responsabilidade real eu assumi hoje?','Como eu me senti ao devolver o que não era meu?']),
N('Neemias 1.8-11','Orar a partir da promessa','Neemias pediu a Deus que se lembrasse da palavra que Ele mesmo tinha dado. A oração dele não nasceu do desespero, mas da promessa. Ele orou com a Palavra na mão.','Hoje você vai trocar a oração que só descreve o problema por uma oração ancorada no que Deus disse. Você vai escolher uma promessa para cada muro mais derrubado.','A psicanálise entende que cada pessoa vive a partir da história que conta para si mesma. Quando a narrativa é só de perda, a vida inteira se organiza em torno dela. Ressignificar não é negar o passado: é contar a mesma história incluindo o que Deus disse e fez.','Toda vez que uma lembrança é acessada, o cérebro tem a chance de guardá-la de novo com um significado atualizado. Por isso, revisitar uma dor junto com uma verdade nova ajuda a mudar a forma como ela é sentida.','Duas narrativas',['Escolha o muro com a nota mais baixa do dia 1.','Escreva em uma coluna: "O que eu digo para mim sobre isso".','Na outra coluna, escreva: "O que Deus diz sobre isso", com um versículo.','Reescreva a sua frase incluindo a promessa: "Eu sinto... mas Deus diz...".','Cadastre a promessa nessa frente do seu Mapa de Batalha.'],'Quando você perceber que está orando só com o problema','Abrir a Bíblia ou tocar nela','"Lembra-te, Senhor, da palavra que disseste." (Neemias 1.8)','Senhor, eu não oro apenas a partir da minha dor, mas da Tua Palavra. Lembra-Te das promessas que fizeste e faz-me lembrar delas também. Que a minha história seja contada com a Tua verdade dentro dela.','Escreva a promessa que você escolheu num papel e coloque onde vai ver várias vezes hoje.',['Qual história eu tenho contado para mim mesma?','Qual promessa eu escolhi e por quê?','Como a minha frase mudou com a promessa?']),
N('Neemias 2.1-2','Tirar a máscara','O rei percebeu a tristeza no rosto de Neemias, e ele teve muito medo, porque não se podia estar triste diante do rei. Mesmo assim, ele não negou o que sentia. Foi a partir dessa verdade que a porta se abriu.','Hoje você vai identificar onde usa a máscara do "está tudo bem" e escolher um lugar seguro para ser verdadeira.','Winnicott chamou de falso self a parte de nós que aprende a agradar e se adaptar para ser aceita, escondendo o que sente de verdade. Ele protege, mas cobra um preço: a sensação de viver no automático, de não ser vista. O verdadeiro self precisa de um ambiente seguro para aparecer.','Esconder a emoção não faz ela desaparecer. Estudos sobre regulação emocional mostram que apenas suprimir o que se sente tende a manter o corpo ativado e cansado. Reconhecer e expressar com segurança reduz essa carga.','Máscaras e lugares seguros',['Escreva onde você mais usa a máscara do "está tudo bem": em casa, na igreja, no trabalho, com a família.','Escreva o que você sente por trás da máscara em cada lugar.','Escreva o que você teme que aconteça se tirar a máscara.','Escolha uma pessoa ou um lugar seguro onde você possa ser verdadeira.','Lembre: diante de Deus, você não precisa de máscara nenhuma.'],'Quando você responder "tudo bem" no automático','Tocar levemente o rosto','"Diante de Ti eu não preciso fingir."','Pai, Tu vês o meu rosto e o meu coração. Diante de Ti eu tiro as máscaras que aprendi a usar para ser aceita. Dá-me lugares e pessoas seguras, e ensina-me a viver de forma verdadeira, sem medo.','Quando perguntarem como você está hoje, responda com mais verdade do que de costume.',['Onde eu mais uso a máscara?','O que eu temo que aconteça se eu for verdadeira?','Com quem eu posso ser eu mesma?']),
N('Neemias 2.4-5','A pausa que muda a resposta','Quando o rei perguntou o que ele queria, Neemias orou ao Deus dos céus e só então respondeu. Entre a pergunta e a resposta houve uma oração. Uma pausa de segundos mudou a história de uma nação.','Hoje você vai treinar a pausa entre o gatilho e a reação. Você vai aprender a orar antes de responder, principalmente nos momentos de tensão.','A psicanálise observa que muitas reações nossas não são respostas ao presente, mas repetições de reações antigas. É como se uma ferida antiga respondesse no nosso lugar. A pausa abre espaço para escolher, em vez de repetir.','Diante de um gatilho, a amígdala reage em frações de segundo, antes da parte do cérebro que pensa e avalia. Alguns segundos de pausa e uma expiração lenta dão tempo para o córtex pré-frontal entrar em cena e regular a resposta.','A pausa de Neemias',['Lembre de uma situação recente em que você reagiu e se arrependeu.','Escreva: o que aconteceu, o que você sentiu no corpo e o que você fez.','Agora treine a pausa: inspire contando até 4 e solte o ar contando até 6, duas vezes.','Durante a pausa, faça uma oração de uma frase: "Senhor, responde por mim."','Escreva como você gostaria de ter respondido.'],'Quando sentir o calor subir ou a vontade de rebater','Pressionar levemente o polegar contra o indicador e soltar o ar devagar','"Senhor, responde por mim."','Senhor, ensina-me a orar antes de reagir. Quando o gatilho vier, dá-me alguns segundos de silêncio diante de Ti. Que as minhas respostas nasçam da Tua paz e não das minhas feridas.','Use a âncora pelo menos uma vez hoje antes de responder alguém.',['Em que situação eu costumo reagir sem pensar?','O que eu senti no corpo antes de reagir?','Como foi usar a pausa hoje?']),
N('Neemias 2.11-16','A ronda da noite','Neemias saiu à noite, com poucos homens, para examinar os muros em silêncio. Ele não fez alarde nem tomou decisões precipitadas. Primeiro observou, com calma, o tamanho real do estrago.','Hoje você vai fazer uma ronda interior: observar o que sente e pensa, sem julgar e sem tentar resolver ainda.','Na associação livre, recurso central da psicanálise, a pessoa fala o que vier à mente, sem censura. É assim que conteúdos escondidos começam a aparecer. Escrever livremente funciona de modo parecido: o que estava abafado ganha palavras.','Pesquisas em neurociência mostram que colocar uma emoção em palavras diminui a ativação da amígdala, o centro de alarme do cérebro. Nomear acalma. Por isso escrever o que se sente é uma forma concreta de regulação.','Escrita livre da ronda',['Separe 10 minutos e um lugar tranquilo.','Comece com: "Neste momento, o que está dentro de mim é..."','Escreva sem parar, sem corrigir, sem reler. Se travar, escreva "não sei o que escrever" até a próxima frase vir.','Ao terminar, leia e sublinhe as palavras que mais chamaram a sua atenção.','Escreva em uma frase o que você descobriu.'],'Quando a mente estiver acelerada e confusa','Escrever uma palavra que descreva o que você sente','"Senhor, sonda-me e conhece o meu coração." (Salmo 139.23)','Senhor, sonda o meu coração como Neemias examinou os muros na noite. Mostra-me o que eu ainda não vi. Eu não tenho medo de olhar, porque estou olhando ao Teu lado.','Antes de dormir, escreva em uma palavra como foi o seu dia emocionalmente.',['O que apareceu na escrita livre que eu não esperava?','Quais palavras eu sublinhei?','O que essa ronda me mostrou?']),
N('Neemias 2.17-18','Levantemo-nos e edifiquemos','Neemias mostrou ao povo a situação e disse: venham, vamos reconstruir. E o povo respondeu: levantemo-nos e edifiquemos. Depois de olhar, chorar e orar, chega a hora de decidir.','Hoje você vai sair da análise e entrar na decisão. Você vai escolher um muro para começar e definir o primeiro tijolo, pequeno o bastante para ser feito ainda hoje.','A psicanálise diferencia o desejo da demanda: o que eu quero de verdade e o que os outros esperam de mim. Muitas mulheres travam porque tentam reconstruir o muro que os outros querem, e não o que Deus colocou no coração delas.','Metas grandes e vagas paralisam. Metas pequenas e concretas ativam o sistema de motivação do cérebro: cada passo concluído gera a energia para o próximo. A reconstrução se faz tijolo por tijolo.','O primeiro tijolo',['Escolha um único muro para começar nesta campanha.','Escreva: "Eu quero reconstruir este muro porque..." e confira se o motivo é seu ou é cobrança de alguém.','Escreva como esse muro estará quando estiver de pé.','Defina o primeiro tijolo: uma ação de até 15 minutos que você pode fazer hoje.','Faça o primeiro tijolo antes de dormir.'],'Quando a desmotivação disser que não adianta','Ficar de pé e respirar fundo','"Levantemo-nos e edifiquemos." (Neemias 2.18)','Pai, eu decido me levantar. Eu escolho este muro para reconstruir contigo. Fortalece as minhas mãos para o primeiro tijolo e para cada um que virá depois.','Faça hoje o primeiro tijolo que você definiu no exercício.',['Qual muro eu escolhi reconstruir?','O meu motivo é meu ou é cobrança de alguém?','Qual foi o meu primeiro tijolo?']),
N('Neemias 2.19-20','Quando a zombaria tenta te parar','Assim que a obra começou, vieram os zombadores: Sambalate, Tobias e Gesém riram e desprezaram. Neemias não discutiu nem se justificou. Respondeu: o Deus dos céus é quem nos dará bom êxito.','Hoje você vai identificar as vozes que zombam da sua reconstrução, as de fora e, principalmente, as de dentro, e vai aprender a responder como Neemias.','Muitas das críticas que nos paralisam são vozes de outras pessoas que internalizamos ao longo da vida: um pai, uma mãe, um professor, um ex. Com o tempo, passamos a falar com nós mesmas com a voz delas. Reconhecer de quem é a voz enfraquece o poder dela.','O cérebro dá mais peso às experiências negativas do que às positivas, um viés que um dia protegeu a nossa sobrevivência. Por isso uma crítica marca mais do que dez elogios. Contrapor de forma intencional é necessário para equilibrar.','Respondendo aos zombadores',['Escreva as frases de zombaria que você ouve por dentro quando tenta mudar.','Ao lado de cada uma, escreva de quem é essa voz originalmente.','Escreva a resposta de Neemias adaptada: "O Deus dos céus vai me dar bom êxito em..."','Leia as respostas em voz alta, com firmeza.'],'Quando a voz de dentro disser "você não vai conseguir"','Erguer o queixo e firmar os pés no chão','"O Deus dos céus me dará bom êxito." (Neemias 2.20)','Deus dos céus, eu não vou discutir com as vozes que zombam de mim. Eu respondo com a Tua Palavra: Tu és quem me dá bom êxito. Silencia em mim as vozes que não vêm de Ti.','Continue hoje o que você começou ontem, mesmo que uma voz diga que não adianta.',['Que voz de zombaria eu mais ouço por dentro?','De quem é essa voz originalmente?','Como foi responder com a Palavra?']),
N('Neemias 3.1, 10, 28','Cada um diante da sua casa','No capítulo 3, cada família reconstruiu um trecho do muro, muitos exatamente em frente à própria casa. Ninguém reconstruiu tudo sozinho, e ninguém ficou responsável pelo trecho do outro.','Hoje você vai definir qual é o seu trecho do muro. Você vai parar de tentar reconstruir a vida dos outros e assumir a sua parte.','A psicanálise chama de projeção o mecanismo de colocar no outro o que é nosso. Às vezes cuidamos tanto da vida dos outros, marido, filhos, pais, que fugimos do nosso próprio trecho. Assumir o próprio desejo e a própria parte é sinal de maturidade emocional.','A sensação de controle sobre a própria vida, mesmo em coisas pequenas, reduz o estresse. Tentar controlar o que não depende de nós faz o oposto: mantém o cérebro em alerta e esgota.','O meu trecho do muro',['Faça dois círculos: "o que depende de mim" e "o que não depende de mim".','Coloque as preocupações desta semana em cada círculo.','Para o que não depende de você, escreva uma oração de entrega.','Para o que depende de você, escreva uma ação concreta.','Escreva: "O meu trecho é..." e complete.'],'Quando você se pegar tentando consertar a vida de alguém','Colocar a mão sobre o próprio coração','"Senhor, eu cuido do meu trecho. O resto é Teu."','Senhor, eu assumo o trecho do muro que é meu. Eu entrego a Ti a vida das pessoas que amo e paro de carregar o que não me pertence. Dá-me fidelidade no que depende de mim e descanso no que depende de Ti.','Deixe de resolver hoje algo que é responsabilidade de outra pessoa.',['O que eu carrego que não é meu?','Qual é o meu trecho do muro?','Como me senti ao soltar o que não depende de mim?']),
N('Neemias 4.1-3','Até uma raposa derrubaria','Tobias zombou: se uma raposa subir nesse muro, ele cai. O ataque mirava a autoestima do povo. Fazer as pessoas acreditarem que o que elas constroem não vale nada é uma estratégia antiga.','Hoje você vai cuidar das feridas na sua autoimagem: frases e situações que fizeram você acreditar que o que constrói é frágil ou não tem valor.','A forma como nos vemos se forma a partir do olhar dos outros, desde a infância. Quando esse olhar foi de desprezo ou comparação, a pessoa cresce sentindo que nada do que faz é suficiente. Essa ferida na autoimagem precisa ser vista para ser tratada.','Estudos mostram que a rejeição e a humilhação ativam no cérebro regiões ligadas à dor física. Não é exagero dizer que palavras doem. Por isso elas precisam de cuidado, e não apenas de esquecimento.','O muro que dizem ser frágil',['Escreva três frases que fizeram você duvidar do seu valor.','Anote quem disse e em que fase da sua vida.','Escreva como essas frases afetam suas decisões hoje.','Para cada frase, escreva a verdade de Deus sobre você, com um versículo.','Rasgue o papel com as frases antigas e guarde o das verdades.'],'Quando você se comparar com outra mulher ou se diminuir','Tocar o próprio ombro como quem acolhe','"Eu sou obra das mãos de Deus." (Efésios 2.10)','Pai, cura as feridas que palavras deixaram na minha autoimagem. O que Tu constróis em mim não é frágil. Eu recebo o Teu olhar sobre mim e abandono as palavras que me diminuíram.','Anote três coisas que você faz bem e leia em voz alta antes de dormir.',['Qual frase mais me feriu?','Como ela ainda afeta as minhas escolhas?','Qual verdade de Deus eu escolho sobre mim?']),
N('Neemias 4.6','O muro na metade','O muro foi levantado até a metade da sua altura, porque o povo tinha ânimo para trabalhar. Metade não é tudo, mas também não é nada. A metade é a prova de que a obra está acontecendo.','Hoje você vai reconhecer o que já foi reconstruído, em vez de olhar só para o que falta.','A psicanálise ensina que a mudança é um processo, não um evento. Elaborar uma questão leva tempo, e é comum querer desistir no meio, quando o entusiasmo inicial passa. Tolerar a frustração do processo é parte da cura.','A neuroplasticidade, capacidade do cérebro de criar novos caminhos, depende de repetição. Um novo jeito de pensar e reagir se fortalece cada vez que é praticado. A metade do caminho é exatamente onde a nova rede está se formando.','O que já está de pé',['Releia o que você escreveu nos primeiros dias da campanha.','Escreva cinco pequenas mudanças que você já percebe, mesmo que sutis.','Escreva o que ainda falta e o que você sente sobre isso.','Agradeça a Deus por cada mudança, uma por uma.'],'Quando o desânimo disser que nada mudou','Contar nos dedos três coisas que já mudaram','"Aquele que começou a boa obra vai completá-la." (Filipenses 1.6)','Senhor, obrigada pelo muro que já está de pé. Dá-me ânimo para continuar quando o entusiasmo passar. Eu creio que Tu vais completar a obra que começaste.','Conte para alguém uma mudança que você percebeu em si mesma.',['Quais mudanças eu já percebo?','O que ainda falta e como me sinto sobre isso?','O que me ajuda a não desistir no meio?']),
N('Neemias 4.9','Orar e pôr guarda','Quando as ameaças aumentaram, o povo orou a Deus e colocou guardas de dia e de noite. Fé e estratégia andaram juntas. Eles não escolheram entre orar e se proteger: fizeram as duas coisas.','Hoje você vai montar a sua guarda: identificar os seus gatilhos e decidir, antes, como vai responder a eles.','Defesas psíquicas não são ruins. Precisamos delas. O problema são as defesas rígidas, que nos fecham para tudo, ou a falta de defesas, que nos deixa expostas a tudo. Limites saudáveis são defesas flexíveis: protegem sem isolar.','O cérebro economiza energia transformando comportamentos repetidos em hábitos automáticos. Planejar com antecedência a resposta a um gatilho cria um novo hábito, que com o tempo passa a funcionar sem esforço.','Plano de guarda',['Liste três gatilhos que costumam derrubar o seu dia: uma situação, uma pessoa, um horário.','Para cada gatilho, escreva o que você costuma sentir e fazer.','Escreva a nova resposta: "Quando ... acontecer, eu vou ..."','Inclua em cada plano uma oração curta e uma ação prática.'],'Quando um dos gatilhos aparecer','Usar a pausa de Neemias: polegar no indicador e expiração longa','"Eu oro e ponho guarda." (Neemias 4.9)','Pai, eu oro e ponho guarda. Ensina-me a proteger o meu coração com sabedoria, sem me fechar para a vida. Guarda as portas da minha mente e da minha casa.','Coloque em prática hoje o plano de guarda para pelo menos um gatilho.',['Quais são os meus principais gatilhos?','Qual nova resposta eu escolhi?','Como foi colocar o plano em prática?']),
N('Neemias 4.14','Lembrem-se do Senhor','Diante do medo do povo, Neemias disse: não tenham medo; lembrem-se do Senhor, que é grande e temível, e lutem por suas famílias e suas casas. O remédio para o medo foi a memória de quem Deus é.','Hoje você vai encarar um medo específico, sem fugir dele, lembrando de quem Deus é.','A psicanálise diferencia o medo, que tem um objeto claro, da angústia, que é um mal-estar sem nome. Dar contorno à angústia, transformá-la em um medo nomeado, já reduz o seu poder. O que tem nome pode ser enfrentado.','O medo ensina o cérebro a evitar. E cada vez que evitamos, o medo cresce. Enfrentar em pequenos degraus, de forma segura, ensina ao cérebro que aquilo pode ser suportado.','Escada do medo',['Escreva um medo que tem limitado a sua vida.','Divida esse medo em cinco degraus, do mais fácil ao mais difícil de enfrentar.','Escolha o primeiro degrau e escreva quando vai subi-lo.','Ao lado de cada degrau, escreva um atributo de Deus que você vai lembrar.'],'Quando o medo apertar o peito','Mão no peito e expiração longa','"Não temas; lembra-te do Senhor." (Neemias 4.14)','Senhor grande e temível, eu me lembro de quem Tu és. O meu medo é real, mas Tu és maior. Dá-me coragem para subir o primeiro degrau e lutar pela minha casa.','Suba hoje o primeiro degrau da sua escada do medo.',['Qual medo eu nomeei hoje?','Qual foi o primeiro degrau?','O que eu lembrei sobre Deus ao enfrentar?']),
N('Neemias 4.17','Uma mão na obra, outra na espada','Os construtores trabalhavam com uma mão e com a outra seguravam a arma. Era um tempo de ameaça, e eles precisavam construir e vigiar ao mesmo tempo. Mas aquele estado não era para sempre: era para o tempo de guerra.','Hoje você vai perceber se está vivendo em alerta constante, mesmo quando a ameaça já passou, e vai começar a soltar a espada onde ela não é mais necessária.','Quem passou por situações difíceis pode desenvolver uma vigilância constante, como se o perigo pudesse voltar a qualquer momento. Essa defesa foi útil um dia, mas quando permanece depois que a ameaça passou, rouba o descanso e a alegria.','Viver em alerta mantém o corpo produzindo hormônios do estresse de forma contínua. O resultado aparece como cansaço, tensão muscular, sono ruim e irritação. O corpo precisa aprender que agora está seguro.','Escaneamento do corpo',['Sente-se, feche os olhos e respire devagar.','Percorra o corpo da cabeça aos pés e perceba onde há tensão: mandíbula, ombros, estômago, mãos.','Em cada ponto tenso, solte o ar devagar e diga: "Aqui eu posso descansar."','Escreva em que situações você fica em alerta sem necessidade.','Escreva o que você poderia soltar a partir de hoje.'],'Quando perceber a mandíbula ou os ombros tensos','Soltar os ombros e abrir as mãos','"Em paz me deito e logo pego no sono." (Salmo 4.8)','Pai, Tu és a minha proteção. Ensina o meu corpo e a minha mente que eu posso descansar em Ti. Onde eu vivo em guerra sem necessidade, dá-me paz.','Faça o escaneamento do corpo de novo antes de dormir.',['Onde eu guardo tensão no corpo?','Em que situações vivo em alerta sem necessidade?','O que eu decidi soltar?']),
N('Neemias 5.1-13','Quando a crise está dentro de casa','No meio da obra, surgiu um clamor dentro do próprio povo: dívidas, juros abusivos, famílias oprimidas por outras famílias. Neemias não ignorou. Ele parou, refletiu e corrigiu o que estava errado dentro de casa.','Hoje você vai olhar para os padrões que se repetem na sua família, com dinheiro, com conflitos, com afeto, e decidir quais vão parar em você.','Freud observou que tendemos a repetir aquilo que não conseguimos elaborar. Padrões familiares passam de geração em geração justamente porque não são vistos: o jeito de lidar com dinheiro, com raiva, com silêncio. O que é visto pode ser interrompido.','Comportamentos repetidos por anos formam caminhos automáticos no cérebro. Eles parecem naturais, mas foram aprendidos. Tudo o que foi aprendido pode ser reaprendido, com consciência e repetição.','Padrões da minha casa',['Escreva como a sua família de origem lidava com dinheiro, com raiva, com afeto e com fé.','Marque o que você repete hoje, mesmo sem querer.','Escolha um padrão que vai parar em você.','Escreva o novo padrão que você quer construir no lugar.'],'Quando perceber que está repetindo um padrão antigo','Parar, respirar e dizer o nome do padrão em voz baixa','"Isso para em mim, em nome de Jesus."','Senhor, eu olho para a história da minha família com verdade. Obrigada pelo que recebi de bom. O que não vem de Ti, que pare em mim. Ensina-me a construir um novo padrão para os que vêm depois de mim.','Faça hoje uma escolha diferente em uma área onde você costuma repetir o padrão antigo.',['Qual padrão da minha família eu repito?','Qual padrão vai parar em mim?','Qual novo padrão eu quero construir?']),
N('Neemias 6.3','Não vou descer do muro','Os inimigos chamaram Neemias para uma reunião que, na verdade, era uma armadilha. Ele respondeu: estou fazendo uma grande obra e não posso descer. Ele sabia dizer não.','Hoje você vai treinar o "não" amoroso e firme, aquele que protege a obra que Deus está fazendo em você.','A dificuldade de dizer não muitas vezes nasce do medo de perder o amor do outro. Quem aprendeu cedo que só era amada quando agradava tende a dizer sim a tudo e se esgotar. Dizer não, com amor, é afirmar que você também tem valor.','Ser rejeitada ativa no cérebro sinais de alerta. Por isso dizer não dá tanto desconforto. Mas a sobrecarga de dizer sim a tudo também cobra do corpo: ansiedade, cansaço, ressentimento.','O meu não amoroso',['Liste três situações em que você diz sim querendo dizer não.','Escreva o que você teme que aconteça se disser não.','Escreva um "não" amoroso para cada situação. Exemplo: "Eu te amo, mas desta vez não vou conseguir."','Escolha uma situação para praticar ainda esta semana.'],'Quando sentir que vai dizer sim por medo','Uma mão espalmada à frente, num gesto discreto de pausa','"Estou fazendo uma grande obra, não posso descer." (Neemias 6.3)','Pai, ensina-me a dizer não sem culpa quando for preciso. Que eu não desça do muro que Tu me chamaste a construir. Dá-me firmeza com amor.','Diga hoje um não que você vem adiando, com amor e firmeza.',['Em que situações eu digo sim querendo dizer não?','De onde vem esse medo de dizer não?','Como foi dizer não hoje?']),
N('Neemias 6.9','Fortalece as minhas mãos','Os inimigos tentaram enfraquecer as mãos do povo com intimidação, achando que a obra pararia. Neemias orou: agora, ó Deus, fortalece as minhas mãos. A resposta ao medo foi uma oração curta e direta.','Hoje você vai separar fatos de fantasias: o que realmente está acontecendo e o que a sua mente está imaginando que pode acontecer.','A psicanálise chama de fantasia as cenas que a mente cria a partir dos nossos medos e desejos. Muitas vezes sofremos mais com o que imaginamos do que com o que aconteceu de fato. Separar fato e fantasia devolve o chão.','O cérebro simula o futuro para nos proteger, e o corpo reage a essas simulações como se fossem reais. Por isso uma preocupação imaginada pode acelerar o coração. Voltar aos fatos ajuda o corpo a se acalmar.','Fato ou fantasia?',['Escreva uma preocupação que está tirando a sua paz.','Divida a página em duas colunas: "fatos" (o que aconteceu de verdade) e "fantasias" (o que eu imagino que pode acontecer).','Releia a coluna das fantasias e pergunte: qual a chance real disso acontecer?','Escreva o que você pode fazer hoje com base nos fatos.','Entregue a Deus a coluna das fantasias.'],'Quando a mente começar a imaginar o pior','Firmar os pés no chão e dizer três coisas que você vê ao seu redor','"Agora, ó Deus, fortalece as minhas mãos." (Neemias 6.9)','Agora, ó Deus, fortalece as minhas mãos. Livra a minha mente das cenas de medo que eu crio. Firma-me nos fatos e na Tua fidelidade.','Quando uma preocupação aparecer hoje, pergunte em voz baixa: isso é fato ou fantasia?',['Qual preocupação eu analisei?','O que era fato e o que era fantasia?','Como me senti depois de separar os dois?']),
N('Neemias 6.15-16','O muro concluído','O muro foi concluído em 52 dias. E até os inimigos perceberam que aquela obra tinha sido feita por Deus. O que parecia impossível estava de pé.','Hoje você vai olhar para a mulher que está sendo reconstruída e reconhecer quem você está se tornando.','A identidade não é algo fixo: ela se constrói e se reconstrói ao longo da vida, a partir das experiências e das relações. Reconhecer quem você está se tornando ajuda a sustentar a mudança e a não voltar ao lugar antigo.','Quando novos comportamentos se repetem, o cérebro fortalece novas conexões e elas passam a fazer parte de quem somos. A mudança deixa de ser esforço e começa a ser identidade.','Carta para a mulher do dia 1',['Releia o que você escreveu no primeiro dia da campanha.','Escreva uma carta para a mulher daquele dia, contando o que mudou.','Conte o que você aprendeu, o que soltou e o que reconstruiu.','Termine dizendo a ela uma palavra de encorajamento.'],'Quando duvidar de que você mudou','Ler em voz alta a última frase da sua carta','"Esta obra vem de Deus."','Senhor, obrigada pela mulher que Tu estás reconstruindo em mim. O que parecia impossível está ficando de pé. Que todos vejam que esta obra vem de Ti.','Leia a sua carta para alguém de confiança, se se sentir à vontade.',['O que mudou em mim desde o dia 1?','Quem eu estou me tornando?','O que eu diria para a mulher do dia 1?']),
N('Neemias 8.9-10','A alegria do Senhor é a sua força','Quando o povo ouviu a Palavra, chorou. Mas Neemias disse: não se entristeçam, porque a alegria do Senhor é a força de vocês. Depois de tanto trabalho e lágrimas, havia permissão para celebrar.','Hoje você vai se dar permissão para sentir alegria, sem culpa, e vai planejar momentos de alegria na sua rotina.','Muitas mulheres sentem culpa quando estão alegres, como se não tivessem direito a descansar ou celebrar enquanto há problemas. Essa culpa costuma vir de uma exigência interna muito rígida. A alegria também é obediência.','Emoções positivas ampliam a nossa capacidade de pensar, criar e nos relacionar, e ajudam o corpo a se recuperar do estresse. Alegria não é luxo: é um recurso de força.','Plano de alegria',['Escreva dez pequenas coisas que te trazem alegria: um café, uma música, uma caminhada, uma conversa.','Marque quais você não faz há muito tempo.','Escreva o que você sente quando pensa em se dar esses momentos.','Agende três delas para esta semana.'],'Quando a culpa disser que você não pode se alegrar','Sorrir de propósito, mesmo que levemente','"A alegria do Senhor é a minha força." (Neemias 8.10)','Pai, eu recebo a Tua alegria como força. Tira de mim a culpa de sentir alegria. Ensina-me a celebrar o que Tu estás fazendo, mesmo antes de tudo estar pronto.','Faça hoje uma das coisas da sua lista de alegria.',['O que me impede de sentir alegria sem culpa?','Que alegrias eu tinha esquecido?','Como foi me permitir um momento de alegria hoje?']),
N('Neemias 12.27, 43','Dedicar o que foi reconstruído','Na dedicação dos muros, o povo celebrou com cânticos e tanta alegria que ela foi ouvida de longe. O que foi reconstruído foi consagrado a Deus.','Hoje você vai encerrar a campanha consagrando a Deus tudo o que foi reconstruído e firmando um compromisso para continuar.','Encerrar um ciclo com consciência é parte do processo de elaboração. Quando marcamos o fim, a mente reconhece a mudança e a integra à nossa história. Sem esse marco, é fácil voltar ao lugar antigo.','Rituais e marcos ajudam o cérebro a registrar experiências como significativas, o que fortalece a memória e o compromisso. Por isso celebrar e consagrar não é só simbólico: ajuda a sustentar a mudança.','Consagração dos muros',['Releia o seu registro no secreto desta campanha.','Escreva os muros que foram reconstruídos ou começaram a ser.','Escreva um compromisso para cada um deles para os próximos meses.','Faça uma oração de consagração, em voz alta, entregando cada muro a Deus.','Registre no Mural de Vitórias o que Deus fez nestes 21 dias.'],'Sempre que se lembrar desta campanha','As mãos erguidas, em gratidão','"Até aqui nos ajudou o Senhor." (1 Samuel 7.12)','Senhor, eu dedico a Ti cada muro reconstruído. Tudo o que foi levantado nestes dias é Teu. Guarda a obra que fizeste em mim e dá-me fidelidade para continuar.','Celebre hoje de algum jeito: um culto em casa, uma música, um momento especial com quem você ama.',['Quais muros foram reconstruídos?','Qual compromisso eu firmo daqui para frente?','O que eu quero lembrar para sempre desta campanha?'])
]};
const CARTAS_NEEMIAS=[
{camp:'neemias',data:'2026-11-23',titulo:'Antes de reconstruir, Neemias chorou',ref:'Neemias 1.1-4',p:['Esta semana começamos a caminhar com Neemias. E eu quero que você repare em como a história dele começa: não com um plano, nem com uma estratégia, mas com lágrimas.','Quando soube que os muros de Jerusalém estavam derrubados, ele se sentou e chorou por dias. Um homem de fé, que depois lideraria uma obra enorme, começou pelo luto. Isso me diz algo importante: chorar não é sinal de fraqueza espiritual. É o primeiro passo de quem leva a sério o que foi perdido.','Muitas de nós aprendemos a pular essa etapa. Engolimos a dor, seguimos funcionando e dizemos que está tudo bem. Mas o que não é chorado continua pesando por dentro, em forma de cansaço, irritação e um vazio que a gente não sabe explicar.','Por isso, nesta primeira semana, eu quero te convidar a olhar com coragem para os seus muros. Não para se acusar, mas para ver com os olhos de Deus o que precisa ser reconstruído. Ele não tem pressa com você, mas também não vai deixar você em ruínas.'],passos:['Faça com calma o inventário dos muros do dia 1, se ainda não fez.','Separe um momento esta semana para chorar diante de Deus aquilo que você nunca se permitiu sentir.']},
{camp:'neemias',data:'2026-11-30',titulo:'Quando a zombaria tenta te parar',ref:'Neemias 2.19-20 e 4.1-6',p:['Assim que Neemias começou a reconstruir, vieram os zombadores. Disseram que a obra era fraca, que até uma raposa derrubaria aquele muro. E talvez você esteja ouvindo vozes parecidas, de fora ou de dentro.','Quando a gente decide mudar, é comum que algo dentro de nós resista. Velhas frases voltam: você não vai conseguir, você sempre desiste, isso não é para você. Muitas delas nem são nossas: são vozes que ouvimos ao longo da vida e passamos a repetir.','Neemias não perdeu tempo discutindo com os zombadores. Ele respondeu com uma frase de fé e continuou trabalhando. E a Bíblia diz que o muro chegou à metade, porque o povo tinha ânimo para trabalhar.','Esta semana, eu quero que você faça o mesmo. Não discuta com as vozes que te diminuem. Responda com a Palavra e coloque mais um tijolo. A metade do muro é a prova de que a obra está acontecendo.'],passos:['Escreva as frases de zombaria que você mais ouve por dentro e a resposta da Palavra para cada uma.','Anote toda noite um tijolo que você colocou no dia, por menor que seja.']},
{camp:'neemias',data:'2026-12-07',titulo:'Não desça do muro',ref:'Neemias 6.1-16',p:['Na reta final da obra, os inimigos mudaram de tática. Em vez de zombar, convidaram Neemias para uma conversa. Parecia inofensivo, mas era uma armadilha para tirá-lo do muro.','A resposta dele é uma das frases mais fortes da Bíblia: estou fazendo uma grande obra e não posso descer. Neemias sabia dizer não. Ele entendia que nem todo convite merece um sim, principalmente quando ameaça aquilo que Deus está construindo.','Muitas mulheres se esgotam porque não conseguem dizer não. Têm medo de desagradar, de parecer egoístas, de perder o amor de alguém. E assim descem do muro várias vezes por dia, até a obra parar.','Esta semana, eu oro para que você encontre firmeza com amor. Que você proteja o que Deus está reconstruindo em você. E que, como aconteceu com Neemias, até quem duvidava perceba que esta obra vem de Deus.'],passos:['Identifique um sim que você tem dado por medo e pratique um não amoroso esta semana.','Releia o que você escreveu no início da campanha e anote o que já mudou.']}];

const CAMPANHAS=[NEEMIAS,{id:'ana',mes:'Dezembro',inicio:'2026-12-11',frente:'Filhos',
titulo:'Ana: o clamor pelos filhos',
resumo:'21 dias caminhando com Ana em 1 Samuel 1 e 2, cuidando da fé e das emoções. Para mães, avós, tias, madrinhas e para quem ainda espera.',
dias:[
D('1 Samuel 1.1-2','Uma mulher com nome e história','Antes de contar o milagre, a Bíblia apresenta Ana: o nome, a casa e a dor. Deus não começa pela resposta, começa pela pessoa. Ele conhece a sua história inteira, inclusive os capítulos que você não conta a ninguém.','Hoje você ainda não vai pedir nada. Você vai se apresentar a Deus com honestidade: quem você é como mãe, ou como mulher que espera, o que carrega e o que sente. Esta campanha começa com verdade.','Muitas mulheres oram pelos filhos a partir da culpa ou do medo, sem perceber. Quando a emoção não tem nome, ela dirige a oração por baixo. Dar nome ao que você sente não é falta de fé: é trazer para a luz o que estava no escuro.','Nomeie o que você sente',['Pare e respire fundo três vezes, devagar.','Complete por escrito: "Como mãe, hoje eu me sinto..." com pelo menos três palavras (cansada, com medo, grata, culpada...).','Ao lado de cada palavra, escreva em que momento da rotina ela aparece.'],'Senhor, aqui estou, com o meu nome e a minha história. Tu conheces o que eu sinto antes que eu diga. Recebe o meu cansaço, os meus medos e a minha esperança, e ensina-me a orar pelos meus filhos a partir da verdade, e não da culpa.','Olhe cada filho nos olhos hoje e diga: "Eu sou grata a Deus por você."',['Quais emoções eu descobri que têm guiado as minhas orações?','O que eu quero que Deus faça em mim nestes 21 dias?']),
D('1 Samuel 1.6-7','Quando a dor se repete','Ano após ano, Ana subia ao templo e ouvia a mesma provocação. A dor dela tinha calendário: voltava sempre no mesmo lugar. Deus não se cansa de ouvir sobre a dor que se repete.','Hoje você vai identificar a preocupação com seus filhos que sempre volta. Em vez de fugir dela, você vai olhar para ela com Deus ao seu lado.','Pensamentos repetitivos de preocupação deixam a mente em alerta, como quem espera o pior o tempo todo. O corpo sente: aperto no peito, sono leve, irritação. Reconhecer o ciclo é o primeiro passo para interrompê-lo.','Mapa da preocupação',['Escreva a preocupação que mais volta.','Anote quando ela costuma aparecer: horário, lugar, situação.','Escreva o que você costuma fazer quando ela vem.','Escreva uma verdade da Palavra para dizer a si mesma na próxima vez.'],'Pai, Tu não te cansas de mim. Hoje eu Te entrego outra vez esta preocupação que sempre volta. Quando ela aparecer, lembra-me de que os meus filhos estão nas Tuas mãos, e guarda a minha mente com a Tua paz.','Quando a preocupação aparecer hoje, pare, respire fundo e transforme-a numa oração de uma frase.',['Quando essa preocupação começou na minha vida?','Que verdade de Deus eu escolho lembrar quando ela voltar?']),
D('1 Samuel 1.8','Quando quem está perto não entende','Elcana amava Ana, mas as perguntas dele mostram que não alcançava a dor dela. Às vezes quem está mais perto não consegue entender. Há lugares do coração que só Deus toca.','Hoje você vai olhar para as expectativas que tem colocado sobre as pessoas, especialmente marido, mãe ou amigas, e devolver a Deus o lugar que é dEle.','Quando esperamos que alguém entenda tudo o que sentimos, a frustração vira mágoa silenciosa. As pessoas importam, mas nenhuma delas consegue ser a nossa fonte.','O que é de quem',['Faça duas colunas: "o que eu espero das pessoas" e "o que só Deus pode me dar".','Liste pelo menos três itens em cada uma.','Risque da primeira coluna o que, na verdade, pertence à segunda.'],'Senhor, livra-me de cobrar das pessoas o que só Tu podes suprir. Cura as mágoas que nasceram das minhas expectativas e seja Tu o meu primeiro lugar de consolo.','Agradeça hoje a alguém próximo por algo que essa pessoa faz bem, sem cobrar o que ela não consegue dar.',['De quem eu tenho esperado o que só Deus pode me dar?','Que mágoa eu preciso entregar hoje?']),
D('1 Samuel 1.9-10','Levantar-se da mesa','Depois de comer, Ana se levantou e foi à presença do Senhor. Com a alma amargurada, orou e chorou muito. A dor que só era remoída virou oração.','Hoje é dia de se levantar. Separe um tempo sem pressa, feche a porta e derrame diante de Deus o que tem sufocado você, sem filtro e sem formalidade.','Engolir o choro por muito tempo cansa a alma. Chorar diante de Deus não é fraqueza: é deixar a emoção seguir o seu caminho, em vez de ficar presa no corpo.','Carta para Deus',['Escreva uma carta começando com: "Senhor, o que eu nunca te disse é...".','Não corrija nem enfeite: escreva como vier.','Leia a carta em voz baixa, como oração.'],'Pai, eu me levanto da mesa da preocupação e venho até Ti. Recebe as minhas lágrimas e as palavras que eu guardei por tanto tempo. Eu confio que Tu ouves.','Reserve 15 minutos hoje, de porta fechada e celular longe, só para estar com Deus.',['O que eu escrevi na carta que me surpreendeu?','Como eu me senti depois de derramar o coração?']),
D('1 Samuel 1.11','Um pedido que nasce da entrega','Ana pede um filho e, no mesmo pedido, já o entrega ao Senhor. Ela ora pelo propósito de Deus, não só pelo próprio desejo.','Hoje você vai revisar os seus pedidos pelos filhos. Alguns nascem do coração de Deus; outros, do medo ou do controle. Você vai reescrevê-los à luz do propósito dEle.','O medo de perder o controle muitas vezes se disfarça de cuidado. Querer o melhor para os filhos é amor; querer decidir tudo por eles é ansiedade. Perceber a diferença traz alívio.','Reescreva os seus pedidos',['Liste os pedidos que você mais faz pelos seus filhos.','Ao lado de cada um, marque: nasce do amor, do medo ou do controle?','Reescreva os que nasceram do medo como entrega: "Senhor, eu Te entrego...".'],'Senhor, alinha os meus pedidos ao Teu coração. Onde há medo, coloca confiança. Que eu deseje para os meus filhos aquilo que Tu desejas para eles.','Abra a frente Filhos no seu Mapa de Batalha e atualize os pedidos com a nova escrita.',['Qual pedido meu nascia do medo?','Como ele ficou depois de reescrito?']),
D('1 Samuel 1.12-13','Orar quando a voz não sai','Ana orava no coração: os lábios se moviam, mas a voz não saía. Deus ouve também a oração sem som.','Hoje você vai praticar a oração do silêncio. Nem sempre é preciso falar muito; às vezes é preciso apenas permanecer.','Quando a mente está cheia, as palavras faltam. Desacelerar a respiração ajuda o corpo a sair do estado de alerta e abre espaço para ouvir.','Respiração com a Palavra',['Sente-se com os pés no chão.','Inspire contando até 4, pensando: "O Senhor é".','Solte o ar contando até 6, pensando: "o meu pastor" (Salmo 23.1).','Repita por 3 minutos, sem pressa. Use o botão "Respirar comigo" abaixo.'],'Pai, Tu ouves até o que eu não consigo dizer. Recebe o meu silêncio como oração e acalma a minha mente na Tua presença.','Faça a respiração com a Palavra em um momento tenso do seu dia.',['Que palavras ficaram presas no meu peito?','O que eu percebi quando fiquei em silêncio?']),
D('1 Samuel 1.14-16','Firme mesmo mal compreendida','Eli achou que Ana estava embriagada. Ela respondeu com respeito e firmeza: estava derramando a alma diante do Senhor. E não saiu do lugar de oração.','Hoje você vai cuidar das feridas de julgamento: falas que fizeram você duvidar da sua fé ou da sua maternidade. Elas não vão mais decidir se você ora.','Críticas repetidas viram uma voz interna. Muitas mães se cobram com frases que ouviram de outras pessoas. Separar a sua voz da voz delas devolve liberdade.','De quem é essa voz?',['Escreva três frases duras que você costuma dizer a si mesma como mãe.','Ao lado de cada uma, anote de onde ela veio.','Reescreva cada frase como Deus falaria com você.'],'Senhor, que a opinião de ninguém me tire do meu quarto de guerra. Cura as feridas deixadas por julgamentos e ensina-me a ouvir a Tua voz sobre mim.','Quando uma dessas frases aparecer hoje, diga em voz baixa a versão reescrita.',['Qual voz eu decidi não obedecer mais?','O que Deus diz sobre mim como mãe?']),
D('1 Samuel 1.17-18','O rosto que muda antes da resposta','Ana voltou, comeu, e o seu rosto já não era o mesmo. Ela ainda não estava grávida. A circunstância não tinha mudado, mas ela sim.','Hoje você vai praticar a entrega concreta: escolher um pedido e deixá-lo nas mãos de Deus, sem desistir de orar e sem carregar sozinha.','Entregar não é deixar de se importar. É parar de carregar sozinha um peso que não cabe nos seus ombros. A paz da entrega é real, e o corpo sente.','Exercício das duas mãos',['Escreva numa folha o pedido que mais pesa.','Segure a folha com as mãos fechadas e diga a Deus o que você teme.','Abra as mãos e ore: "Eu deixo contigo".','Guarde a folha na sua Bíblia como sinal da entrega.'],'Pai, eu deixo este pedido contigo. Dá-me a paz de quem sabe em que mãos colocou os seus filhos. Muda o meu rosto, mesmo antes da resposta.','Faça hoje uma refeição com a família sem falar da preocupação que você entregou.',['O que eu entreguei hoje?','O que mudou em mim depois da entrega?']),
D('1 Samuel 1.19','Adorar e voltar para casa','A família se levantou de madrugada, adorou ao Senhor e voltou para casa. A fé não ficou no templo: voltou com eles para a rotina.','Hoje você vai levar a presença de Deus para dentro da rotina da sua casa, de um jeito simples e possível.','Casas cheias de pressa e cobrança deixam todos tensos. Pequenos rituais de paz, repetidos, ajudam crianças e adultos a se sentirem seguros.','Um momento de paz na casa',['Escolha um horário fixo do dia: café, banho ou hora de dormir.','Pense em algo de 3 minutos: um versículo, uma oração curta, uma música.','Escreva como vai fazer, para começar ainda hoje.'],'Senhor, que a minha casa seja um lugar de adoração nos dias comuns. Entra na nossa rotina e faz da nossa casa um lugar de paz.','Faça hoje com seus filhos o momento de paz que você planejou.',['Como foi o momento de paz em casa?','O que eu quero repetir todos os dias?']),
D('1 Samuel 1.20','O nome que lembra a oração','Ana chamou o filho de Samuel, porque o tinha pedido ao Senhor. O nome dele contava uma história de oração.','Hoje você vai fazer memória: lembrar como Deus cuidou de cada filho até aqui, desde a chegada dele até hoje.','A mente cansada tende a lembrar mais do que deu errado. Recordar de propósito o cuidado de Deus fortalece a esperança e equilibra o olhar.','Linha do cuidado de Deus',['Para cada filho, escreva três momentos em que você viu o cuidado de Deus.','Pode ser algo grande ou pequeno.','Agradeça por cada momento, em voz alta.'],'Pai, obrigada por cada filho que confiaste a mim. Que a vida deles seja sempre lembrada como uma história da Tua bondade.','Conte hoje a um dos seus filhos uma história de como Deus cuidou dele.',['Qual lembrança mais me emocionou?','O que essa memória me ensina sobre o futuro?']),
D('1 Samuel 1.21-23','Cuidar no tempo certo','Ana ficou em casa com o menino até desmamá-lo. Havia um tempo de cuidar de perto, e ela o honrou sem culpa.','Hoje você vai olhar para a fase que cada filho vive e perguntar: o que esta fase pede de mim agora?','Muitas mães vivem divididas entre o que fazem e o que acham que deveriam fazer. A culpa rouba a presença. Aceitar a fase atual devolve leveza.','O que esta fase pede',['Escreva a fase de cada filho: bebê, infância, adolescência ou vida adulta.','Anote uma necessidade real dessa fase.','Anote uma cobrança que não é dessa fase e pode ser solta.'],'Senhor, dá-me sabedoria para cada fase dos meus filhos. Tira de mim a culpa que não vem de Ti e ensina-me a estar presente do jeito que eles precisam hoje.','Passe 10 minutos hoje com um filho fazendo o que ele gosta, sem celular e sem correção.',['Que culpa eu decidi soltar?','Como foi estar presente sem cobrança?']),
D('1 Samuel 1.27-28','Este filho é do Senhor','Ana levou Samuel ao templo e declarou que, por toda a vida, ele seria do Senhor. Os filhos nos são confiados, mas não nos pertencem.','Hoje é o dia da entrega consciente. Você vai consagrar cada filho a Deus pelo nome, sem desistir de cuidar.','O apego cheio de medo nos faz controlar. A entrega não diminui o amor: tira dele o medo. Mães que entregam continuam cuidando, mas com mais descanso.','Oração de consagração',['Escreva o nome de cada filho.','Abaixo de cada nome, complete: "Senhor, eu Te entrego..." (saúde, escolhas, futuro, fé).','Leia em voz alta, um por um.'],'Pai, eu entrego os meus filhos a Ti. Eu cuido, ensino e oro, mas és Tu quem segura a vida deles. Recebe cada um pelo nome.','Antes de dormir, abençoe cada filho pelo nome, de perto ou à distância.',['O que foi mais difícil entregar?','Que paz eu senti depois da consagração?']),
D('1 Samuel 2.1-2','Um cântico depois da entrega','Ana não saiu do templo vazia: saiu cantando. O coração dela se alegrou no Senhor, porque não há ninguém santo como Ele.','Hoje você vai treinar o coração para a gratidão, mesmo com pedidos em espera.','Gratidão não é negar a dor. É ampliar o olhar para perceber também o que está de pé. Agradecer de forma específica ajuda a mente a sair do modo de ameaça.','Gratidão específica',['Escreva cinco motivos de gratidão sobre seus filhos, bem específicos: não "saúde", mas "o abraço que ele me deu ontem".','Escreva um motivo de gratidão sobre você como mãe.','Transforme a lista numa pequena oração de louvor.'],'Senhor, o meu coração se alegra em Ti. Mesmo esperando, eu escolho Te agradecer, porque não há ninguém santo como Tu.','Diga hoje a cada filho um motivo específico pelo qual você é grata por ele.',['Qual gratidão eu nunca tinha percebido?','Como me senti ao agradecer em voz alta?']),
D('1 Samuel 2.19','A túnica de cada ano','Todo ano, Ana fazia uma pequena túnica e a levava para Samuel. Era um amor constante, feito à mão, mesmo de longe.','Hoje você vai pensar nos pequenos gestos que comunicam amor aos seus filhos e escolher um para repetir.','Filhos se sentem seguros com amor previsível. Gestos simples e repetidos dizem "você importa" mais do que grandes acontecimentos.','Minha túnica de amor',['Pergunte a si mesma: como cada filho se sente amado? Por palavras, tempo, toque, presentes ou ajuda?','Escolha um gesto para cada filho.','Defina quando vai repetir esse gesto.'],'Pai, ensina-me a amar nos pequenos gestos. Que os meus filhos se sintam cuidados em cada detalhe, assim como eu sou cuidada por Ti.','Faça hoje o gesto escolhido para pelo menos um filho.',['Qual gesto eu escolhi para cada filho?','Como ele reagiu?']),
D('1 Samuel 2.26','Crescer diante de Deus','O menino Samuel crescia e era querido pelo Senhor e pelas pessoas. Deus cuida do crescimento inteiro: corpo, emoções, fé e relacionamentos.','Hoje você vai orar de forma estratégica por áreas específicas da vida de cada filho.','Quando oramos só pelos problemas, enxergamos só o que falta. Orar pelo crescimento ajuda a ver os filhos com esperança e paciência.','Mapa do crescimento',['Para um filho, escreva quatro áreas: corpo, emoções, fé e relacionamentos.','Em cada área, anote um sinal de crescimento que você já vê.','Anote um pedido para cada área.'],'Senhor, faz os meus filhos crescerem diante de Ti em todas as áreas. Dá-me olhos para ver o que já está florescendo.','Elogie hoje um sinal de crescimento que você notou em um filho.',['Que crescimento eu tinha deixado de enxergar?','Por qual área vou orar com mais constância?']),
D('1 Samuel 3.10','Fala, Senhor','Ainda menino, Samuel aprendeu a responder à voz de Deus: fala, porque o teu servo está ouvindo. Esse é um dos maiores pedidos que podemos fazer pelos filhos.','Hoje você vai orar para que seus filhos reconheçam a voz de Deus, e também vai praticar a escuta dentro de casa.','Filhos aprendem a ouvir sendo ouvidos. Uma conversa em que eles se sentem escutados, sem pressa de corrigir, fortalece o vínculo e a confiança.','Escuta sem correção',['Escolha um filho e um momento tranquilo.','Faça uma pergunta aberta: "O que foi bom e o que foi difícil hoje?"','Ouça sem corrigir nem aconselhar, apenas acolhendo.'],'Pai, abre os ouvidos dos meus filhos para a Tua voz. Que eles aprendam a dizer: fala, Senhor. E que eu também seja uma mãe que escuta.','Faça a conversa de escuta hoje com um dos seus filhos.',['O que eu ouvi do meu filho que eu não sabia?','O que Deus falou comigo hoje?']),
D('Salmo 127.3','Herança do Senhor','A Palavra diz que os filhos são herança do Senhor. Eles não são um peso a carregar, mas um presente confiado.','Hoje você vai renovar o olhar sobre seus filhos, especialmente sobre aquele que mais tem desafiado você.','Nos dias difíceis, o cansaço faz a gente enxergar o filho só pelo comportamento. Separar quem ele é do que ele faz protege o vínculo e acalma a reação.','Quem ele é, o que ele faz',['Pense no filho que mais te desafia agora.','Escreva o comportamento que mais te tira do sério.','Escreva três qualidades que ele tem, independentemente desse comportamento.','Ore pelas qualidades, não só pelo comportamento.'],'Senhor, renova o meu olhar. Ajuda-me a enxergar os meus filhos como herança Tua, também nos dias cansativos.','Antes de reagir a um comportamento difícil hoje, respire fundo e lembre de uma qualidade desse filho.',['Qual qualidade do meu filho eu tinha esquecido?','Como eu reagi diferente hoje?']),
D('Deuteronômio 6.6-7','A Palavra dentro de casa','Deus pediu que a Palavra estivesse primeiro no coração dos pais e depois fosse ensinada em casa: no caminho, ao deitar e ao levantar.','Hoje você vai planejar como a Palavra entra na sua casa de forma natural, sem peso e sem sermão.','Os filhos aprendem mais pelo que vivemos do que pelo que falamos. Uma fé vivida com leveza atrai mais do que uma fé cobrada.','Um versículo para a casa',['Escolha um versículo curto para a família nesta semana.','Escreva-o num papel e coloque num lugar visível.','Pense numa situação do dia em que você pode lembrá-lo com naturalidade.'],'Pai, que a Tua Palavra viva primeiro em mim. E que ela entre na minha casa de forma natural, nas conversas de cada dia.','Coloque hoje o versículo da semana num lugar visível da casa.',['Que versículo eu escolhi e por quê?','Como meus filhos reagiram?']),
D('2 Timóteo 1.5','A fé que passa de geração','Paulo lembra a fé sincera da avó Loide e da mãe Eunice, que chegou até Timóteo. A fé vivida em casa deixa marcas.','Hoje você vai olhar para a herança de fé que recebeu e para a que deseja deixar.','Todas nós herdamos jeitos de lidar com emoções, com dinheiro e com conflitos. Reconhecer o que veio da sua família ajuda a escolher o que continuar e o que interromper.','O que eu recebi, o que eu deixo',['Escreva três coisas boas que você recebeu da sua família.','Escreva uma coisa que você não quer repetir com seus filhos.','Escreva a herança de fé que você deseja deixar.'],'Senhor, obrigada pelo que recebi de bom. Interrompe em mim o que não vem de Ti e faz da minha fé um caminho até Ti para os meus filhos e netos.','Conte a um filho como você conheceu a Deus ou um momento em que Ele te sustentou.',['O que eu decidi não repetir?','Que herança eu quero deixar?']),
D('Lamentações 2.19','Derramar o coração pelos filhos','A Palavra convida a se levantar durante a noite, derramar o coração como água diante do Senhor e erguer as mãos pela vida dos filhos.','Hoje é dia de intercessão profunda. Separe um tempo maior e ore por cada filho, um de cada vez.','A intercessão cansa quando nasce do desespero. Quando nasce da confiança, fortalece. Antes de começar, acalme o corpo e lembre de quem Deus é.','Intercessão pelo nome',['Faça três respirações lentas.','Para cada filho, ore por três coisas: o coração, os caminhos e a fé.','Termine cada oração com uma promessa da Palavra.'],'Pai, eu levanto as minhas mãos pela vida dos meus filhos. Derramo diante de Ti tudo o que sinto por cada um e confio que Tu ouves.','Ore hoje antes de dormir, com calma, especialmente pelo filho que mais pesa no seu coração.',['Por qual filho o meu coração mais se derramou?','Que promessa eu ancorei para cada um?']),
D('Filipenses 1.6','A boa obra continua','Aquele que começou a boa obra vai completá-la. A história dos seus filhos não terminou, e Deus continua trabalhando, inclusive em você.','Hoje você vai fechar a campanha olhando para tudo o que Deus fez nestes 21 dias e lançando a sua fé para o próximo ano.','Fechar ciclos com consciência ajuda a mente a reconhecer o que mudou. Registrar a caminhada transforma a experiência em memória de fé.','Meu Ebenézer',['Releia os seus registros no secreto desta campanha.','Escreva três mudanças que você percebeu em você.','Escreva uma palavra de fé para cada filho para o próximo ano. Como Samuel em 1 Samuel 7.12: até aqui nos ajudou o Senhor.'],'Senhor, eu creio que a Tua obra na vida dos meus filhos continua, e em mim também. Eu os entrego para o novo ano com confiança.','Registre no Mural de Vitórias pelo menos uma resposta ou mudança desta campanha.',['O que Deus fez em mim nestes 21 dias?','Que palavra eu levo para o próximo ano?'])
]}];
const LIVRE=[
D('Mateus 6.6','Entrar no quarto e fechar a porta','Jesus ensinou a orar em secreto, diante do Pai que vê o que ninguém vê. O quarto de guerra começa com uma porta fechada para o barulho.','Hoje você vai preparar o seu lugar secreto: um canto, um horário e um jeito de se desligar do resto.','A mente que não para nunca descansa. Um lugar e um horário fixos ajudam o corpo a entender que aquele é um momento seguro.','Meu lugar secreto',['Escolha um canto da casa para orar.','Defina um horário possível para todos os dias.','Escreva o que vai deixar do lado de fora da porta: celular, pressa, cobranças.'],'Pai, eu fecho a porta e venho até Ti. Recebe a minha oração e ensina-me a permanecer no secreto.','Volte ao seu lugar secreto amanhã, no mesmo horário.',['O que precisa ficar do lado de fora da porta para eu orar?','Como eu quero que seja o meu tempo com Deus?']),
D('Efésios 6.18','Vigiar com perseverança','Paulo fala de orar em todo tempo, com todo tipo de oração, vigiando com perseverança. Constância vale mais do que intensidade.','Hoje você vai olhar para o seu Mapa de Batalha e escolher a frente que está sem oração.','Quando uma área dói, a gente tende a evitar pensar nela. Mas o que evitamos continua pesando. Olhar com Deus é mais leve do que fugir sozinha.','A frente esquecida',['Abra o seu Mapa de Batalha.','Escolha a frente por onde você menos tem orado.','Escreva por que ela tem ficado de lado.'],'Senhor, dá-me constância. Que eu não ore só quando a dor aperta, mas todos os dias, com fé.','Adicione hoje um pedido novo à frente que estava esquecida.',['Qual frente eu tenho evitado e por quê?','Que passo eu dou hoje nessa área?']),
D('Salmo 62.8','Derramar o coração','O salmista convida a confiar em Deus em todo tempo e derramar diante dEle o coração. Ele é o nosso refúgio.','Hoje você vai esvaziar o coração diante de Deus, sem organizar nada antes.','Guardar tudo para si parece força, mas cansa. Colocar para fora, com segurança, alivia a mente e abre espaço para a paz.','Esvaziar o coração',['Escreva sem parar por 5 minutos tudo o que está pesando.','Leia o que escreveu.','Diga a Deus: "Isso é o que eu estou carregando. Eu Te entrego."'],'Pai, Tu és o meu refúgio. Eu derramo o meu coração diante de Ti e descanso na Tua presença.','Escolha uma das cargas que você escreveu e converse sobre ela com alguém de confiança.',['O que eu estava carregando sozinha?','O que eu senti ao entregar?'])];

const CARTAS=[...CARTAS_NEEMIAS,
{camp:'ana',data:'2026-12-11',titulo:'Quando a dor vira oração',ref:'1 Samuel 1.1-11',p:['Este mês vamos caminhar com Ana. Antes de ser lembrada como a mãe de Samuel, ela foi uma mulher com o coração apertado. Ano após ano, ela subia ao templo com a família carregando a mesma dor. E ainda ouvia provocações justamente onde deveria encontrar descanso.','A Bíblia conta que Ana chorava e não conseguia comer. Repare que a Palavra não esconde isso. Deus não tem vergonha das nossas lágrimas, e a fé não exige que a gente finja que está tudo bem.','Mas um dia algo mudou. Ana se levantou da mesa, foi até a presença do Senhor e, com a alma amargurada, orou e chorou muito (1 Samuel 1.10). A dor que antes ficava guardada virou conversa com Deus. Ela não esperou ter as palavras certas. Ela levou o que tinha.','Talvez você também carregue uma dor que se repete: um filho que preocupa, uma porta que não abre, um cansaço que não passa com uma noite de sono. Esta semana eu quero te convidar a fazer como Ana: sair da mesa, onde a dor só é remoída, e entrar no seu quarto de guerra, onde ela é entregue.','Não é sobre orar bonito. É sobre orar de coração aberto, diante de um Deus que vê em secreto.'],passos:['Na frente Filhos do seu Mapa de Batalha, escreva a dor que você carrega há mais tempo, com as suas palavras.','Ore por ela todos os dias da semana, sem pressa e sem formalidade.']},
{camp:'ana',data:'2026-12-14',titulo:'Mal compreendida no lugar de oração',ref:'1 Samuel 1.12-16',p:['Ana orava em silêncio. Seus lábios se mexiam, mas a voz não saía. O sacerdote Eli, que estava ali, olhou para ela e tirou a pior conclusão: achou que ela estava embriagada.','Imagine a cena. A mulher abre o coração diante de Deus e é julgada justamente no lugar onde deveria ser acolhida. Muitas de nós conhecemos essa dor: ser mal interpretada pela família, na igreja, por quem deveria entender.','O que me toca é a resposta de Ana. Ela não foi embora magoada nem se calou por vergonha. Com respeito e firmeza, explicou que não estava bêbada: estava derramando a alma diante do Senhor (1 Samuel 1.15-16). Ela não deixou que a opinião de alguém a tirasse do lugar de oração.','Nem todo mundo vai entender a sua perseverança. Algumas pessoas vão achar exagero você continuar orando pelo mesmo filho, pelo mesmo casamento, pela mesma causa. Mas o seu quarto de guerra não depende da aprovação de ninguém. Deus vê o que os outros não enxergam.'],passos:['Pense em uma situação em que você se sentiu julgada por insistir em orar. Entregue essa mágoa ao Senhor.','Continue firme no seu turno de vigia todos os dias, mesmo que ninguém perceba.']},
{camp:'ana',data:'2026-12-21',titulo:'Paz antes da resposta',ref:'1 Samuel 1.17-18',p:['Depois de ouvir Ana, Eli a abençoou e disse que fosse em paz. E a Bíblia registra um detalhe lindo: ela voltou, comeu, e o seu rosto já não era o mesmo (1 Samuel 1.18).','Preste atenção no tempo dessa mudança. Ana ainda não estava grávida. Nada à sua volta tinha mudado. A rival continuava em casa, a espera continuava. O que mudou foi dentro dela.','Isso é o que acontece quando a gente entrega de verdade. A oração nem sempre muda a circunstância na hora, mas muda a mulher que atravessa a circunstância. A mente que estava em alerta encontra descanso. O coração que estava apertado volta a respirar.','Nesta semana de Natal, quando a casa fica cheia e as emoções ficam à flor da pele, eu oro para que você experimente essa paz. Não a paz de quem já tem todas as respostas, mas a de quem sabe em que mãos deixou os seus pedidos.'],passos:['Escolha um pedido do seu Mapa de Batalha que tem tirado o seu sono e entregue-o ao Senhor por escrito.','Depois de orar, faça como Ana: levante-se e volte à sua rotina descansando nEle.']},
{camp:'ana',data:'2026-12-28',titulo:'Entregar os filhos ao Senhor',ref:'1 Samuel 1.24-28 e 2.1-2',p:['Chegamos ao fim da nossa caminhada com Ana. Samuel nasceu, cresceu um pouco, e Ana fez algo que mexe com qualquer mãe: levou o menino ao templo e o apresentou ao Senhor. Ela disse que tinha orado por aquele filho e que, por toda a vida dele, ele seria do Senhor (1 Samuel 1.27-28).','Ana entendeu uma verdade que nós, mães, precisamos reaprender todos os dias: nossos filhos nos foram confiados, mas não nos pertencem. Nós cuidamos, ensinamos, corrigimos e oramos, mas quem segura a vida deles é Deus.','E repare no que vem logo depois. Ana não sai do templo vazia. Ela sai cantando. O cântico do capítulo 2 começa com o coração alegre no Senhor e termina proclamando que não há ninguém santo como Ele. Quem entrega com confiança encontra descanso.','Nesta última semana do ano, enquanto você olha para trás e para o ano que vem, eu te convido a fazer a sua própria entrega. Não como quem desiste dos filhos, mas como quem os coloca no lugar mais seguro que existe.'],passos:['Escreva o nome de cada filho e, ao lado, uma promessa da Palavra para o ano novo dele.','Ore por cada um pelo nome e registre no seu Mural de Vitórias o que Deus fez por eles neste ano.']}];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const SEM=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const fLong=s=>{const d=parse(s);return SEM[d.getDay()]+', '+d.getDate()+' de '+MES[d.getMonth()]};
const fShort=s=>{const d=parse(s);return d.getDate()+' de '+MES[d.getMonth()]};
