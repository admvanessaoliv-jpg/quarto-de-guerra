<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FAF6F2">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quarto de Guerra">
<title>Quarto de Guerra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&family=Jost:wght@300;400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
/* VOICE: terna, delicada, acolhedora — um lugar secreto, não um painel.
   IDEA: o quarto de oração: uma janela em arco por onde entra luz suave.
   PICTURE: o arco de luz (login) e o cartão da campanha com o arco em traço fino.
   COLOUR and TYPE: rosé antigo + champanhe sobre porcelana; Plus Jakarta Sans, serifa itálica só nos versículos.
   LAYOUT: app de uma coluna, cartões arredondados, navegação inferior em vidro. */
:root{color-scheme:light dark;
--bg:light-dark(#FAF6F2,#1D1714);--card:light-dark(#FFFFFF,#29211E);--ink:light-dark(#3D2E2A,#F2E9E4);
--muted:light-dark(#8A7871,#BCAAA2);--line:light-dark(#EDE3DC,#3A2F2B);--rose:light-dark(#946559,#D9A79A);
--rose-ink:light-dark(#FFFFFF,#2A1C18);--rose-soft:light-dark(#F4E7E2,#3A2B27);--champ:light-dark(#F5EEE6,#332A24);
--gold:light-dark(#C2A27C,#D2B48E);--sage:light-dark(#4F6E55,#A9C8AE);--sage-soft:light-dark(#E7F0E6,#26332A);
--shadow:light-dark(rgba(61,46,42,.06),rgba(0,0,0,.3));--hero:var(--rose-soft)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto;min-height:100vh;padding:28px 20px 112px}
h1{font-size:30px;line-height:1.1;font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;margin:0}
p{margin:0}
.muted{color:var(--muted)}.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px var(--shadow)}
.verso{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:21px;line-height:1.35;color:var(--rose)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:999px;border:0;background:var(--rose);color:var(--rose-ink);font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;width:100%}
.btn.soft{background:var(--rose-soft);color:var(--rose)}
.btn.line{background:transparent;border:1.5px solid var(--rose);color:var(--rose)}
.btn.small{min-height:44px;font-size:14px;width:auto;padding:0 18px}
.link{background:none;border:0;color:var(--rose);font-weight:600;cursor:pointer;padding:10px 4px;min-height:44px;font-size:14px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
label{font-size:13px;font-weight:600;display:block;margin-bottom:6px}
input,textarea,select{width:100%;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 15px;min-height:50px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;background:var(--rose-soft);color:var(--rose);white-space:nowrap}
.chip.ok{background:var(--sage-soft);color:var(--sage)}
.chip.off{background:var(--champ);color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--rose);border-radius:3px}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px;background:linear-gradient(140deg,var(--rose-soft),var(--champ));border:1px solid var(--line)}
.hero .arch{position:absolute;right:-18px;bottom:-10px;width:150px;opacity:.55;pointer-events:none}
.hero>*:not(.arch){position:relative}
.eyebrow{font-size:12px;font-weight:600;color:var(--rose)}
.dots{display:flex;gap:6px}.dots span{width:11px;height:11px;border-radius:50%;background:var(--line)}.dots span.on{background:var(--rose)}.dots span.rest{background:transparent;border:1.5px dashed var(--rose);box-sizing:border-box}
.avatar{width:46px;height:46px;border-radius:50%;border:0;background:var(--rose-soft);color:var(--rose);font-weight:700;font-size:17px;cursor:pointer;flex:none}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px 16px;cursor:pointer;min-height:64px}
.item b{font-weight:600;display:block}.item .muted{font-size:13px}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.steps i.on{background:var(--rose)}
.num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--rose-soft);color:var(--rose);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.day.done{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}.day.today{outline:2px solid var(--rose);outline-offset:1px}.day:disabled{cursor:default;opacity:.45}
.carta p{margin-bottom:14px;font-size:17px;line-height:1.7}
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(456px,calc(100% - 24px));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 12px 30px var(--shadow);z-index:5}
nav.tabs[hidden]{display:none}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:18px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:500;min-height:54px;justify-content:center}
nav.tabs a.on{color:var(--rose);background:var(--rose-soft);font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.overlay{position:fixed;inset:0;background:rgba(40,25,30,.35);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.overlay.on{display:flex}
.sheet{background:var(--bg);width:min(480px,100%);border-radius:26px;padding:22px;max-height:88vh;overflow:auto;animation:up .28s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.toast{width:max-content;max-width:90%;text-align:center;position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.demo{font-size:12px;text-align:center;color:var(--muted);background:var(--champ);border-radius:999px;padding:6px 12px}
.login{min-height:calc(100vh - 56px);display:flex;flex-direction:column;gap:22px;justify-content:center}
.login .pic{width:100%;max-width:260px;margin:0 auto;display:block}
.brand{text-align:center;display:flex;flex-direction:column;gap:8px}
.brand h1{font-size:34px;font-weight:300;letter-spacing:.02em}.brand h1 b{font-weight:600}
.block{border-radius:20px;padding:16px 18px;background:var(--card);border:1px solid var(--line)}
.block.rose{background:var(--rose-soft);border-color:transparent}
.block.champ{background:var(--champ);border-color:transparent}
.block h3{font-size:14px;font-weight:700;margin:0 0 6px;color:var(--rose)}
.read{font-size:17px;line-height:1.7}
ol.passos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:44px}
details.card summary::-webkit-details-marker{display:none}
details.card[open] summary svg{transform:rotate(90deg)}
.breath{width:180px;height:180px;margin:10px auto;border-radius:50%;background:radial-gradient(circle,var(--card),var(--rose-soft));border:1px solid var(--rose);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--rose);animation:breath 10s ease-in-out infinite}
@keyframes breath{0%{transform:scale(.7)}40%{transform:scale(1)}100%{transform:scale(.7)}}
@media(prefers-reduced-motion:reduce){.breath{animation:none}}
.check{display:flex;align-items:center;gap:10px;font-weight:600}
h1,.saud,.titulo,.brand h1{font-family:"Jost","Plus Jakarta Sans",sans-serif;font-weight:400;letter-spacing:-.005em}
h1{font-size:30px}
.saud{font-size:29px;margin-top:2px}
.sec{font-family:"Jost",sans-serif;font-weight:500;font-size:19px}
.card{border-radius:24px;box-shadow:0 1px 2px rgba(59,43,49,.04),0 14px 34px var(--shadow)}
.hero{background:var(--hero);border:0;border-radius:28px;padding:24px;box-shadow:0 18px 40px var(--shadow)}
.hero .arch{opacity:.4;width:170px;right:-26px;bottom:-14px;color:var(--gold)}
.hero.hoje .arch{width:120px;top:-16px;bottom:auto;right:-18px;opacity:.28}
.hero .titulo{font-size:26px;line-height:1.15;max-width:280px}
.hero .streak{padding-top:12px;border-top:1px solid rgba(163,93,114,.18)}
.eyebrow{color:var(--rose);font-weight:600;font-size:12.5px;letter-spacing:.01em}
.btn{background:linear-gradient(135deg,#B26C82,#97546B);box-shadow:0 8px 20px rgba(163,93,114,.28)}
:root[data-theme=dark] .btn,.dark .btn{background:var(--rose)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn{background:var(--rose);box-shadow:none}}
.btn.soft,.btn.line{background:var(--rose-soft);box-shadow:none}
.btn.line{background:transparent}
.item{border-radius:20px;border-color:var(--line);box-shadow:0 1px 2px rgba(59,43,49,.03)}
.item.soft{background:var(--rose-soft);border-color:transparent}
.ico{width:38px;height:38px;border-radius:13px;background:var(--rose-soft);color:var(--rose);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg.i{width:19px;height:19px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px;min-height:132px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 1px 2px rgba(59,43,49,.03);transition:transform .15s ease}
.tile:active{transform:scale(.98)}
.tile .lbl{font-size:12px;color:var(--muted);font-weight:500}
.tile b{font-weight:600;font-size:15px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.avatar{background:light-dark(linear-gradient(135deg,#F3D3DC,#F4E4D3),var(--rose-soft));color:var(--rose);box-shadow:0 0 0 3px var(--card),0 0 0 4px var(--gold)}
hr.fio{border:0;border-top:1px solid var(--line);margin:4px 0;width:100%}
nav.tabs{border-radius:26px}
nav.tabs a.on{background:var(--rose-soft)}
.block.rose{background:var(--rose-soft)}

.entra{animation:entra .38s ease both}
@keyframes entra{from{opacity:0;transform:translateY(8px)}}
.festa-check{width:96px;height:96px;margin:0 auto}
.festa-check svg{width:100%;height:100%}
.festa-check circle{stroke:var(--rose);stroke-width:2;stroke-dasharray:151;stroke-dashoffset:151;animation:traco .7s ease forwards}
.festa-check path{stroke:var(--rose);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:traco .45s .6s ease forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.94);opacity:.8}}
.btn{transition:transform .15s ease,filter .15s ease}.btn:active{transform:scale(.97)}
.item{transition:transform .15s ease,box-shadow .2s ease}.item:active{transform:scale(.985)}
.bar i{transition:width .6s ease}
@media(prefers-reduced-motion:reduce){.entra,.pulse,.festa-check circle,.festa-check path{animation:none;stroke-dashoffset:0}}

.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
header h1{font-size:32px}
.hscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:20px;margin:0 -20px;padding:2px 20px 8px;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{flex:0 0 74%;scroll-snap-align:start}
.cover{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;gap:6px;text-align:left;min-height:150px;padding:18px;border:0;border-radius:24px;cursor:pointer;font:inherit;color:#3B2B31;box-shadow:0 10px 26px var(--shadow)}
.cover.big{min-height:190px}.cover.small{min-height:104px}
.cover .ct{font-family:"Jost",sans-serif;font-weight:400;font-size:21px;line-height:1.15}
.cover .cs{font-size:13px;opacity:.8}
.cover .eyebrow{color:inherit;opacity:.75}
.cover .arch{position:absolute;right:-20px;top:-16px;width:130px;opacity:.3}
.cover .cbar{display:block;width:100%;height:4px;border-radius:2px;background:rgba(255,255,255,.55);margin-top:6px;overflow:hidden}.cover .cbar i{display:block;height:100%;background:#A35D72}
.c-rose{background:linear-gradient(150deg,#F5D3DD,#FBEDEF)}
.c-champ{background:linear-gradient(150deg,#F1DFC9,#FBF3EA)}
.c-lav{background:linear-gradient(150deg,#E4D9F0,#F7F0F6)}
.c-sage{background:linear-gradient(150deg,#D8E6D6,#F3F4EC)}
.c-vinho{background:linear-gradient(150deg,#8E4A5E,#B7798A);color:#fff}
.c-vinho .arch{color:#fff}
.vthumb{display:flex;flex-direction:column;gap:8px;text-align:left;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:inherit}
.vthumb .vimg{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:16/9;border-radius:18px;background-size:cover;background-position:center;background-color:var(--champ);box-shadow:0 8px 20px var(--shadow)}
.vthumb .play{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.88);color:#A35D72;display:flex;align-items:center;justify-content:center;font-size:15px;padding-left:3px}
.vthumb b{font-weight:600;font-size:14px;line-height:1.3}
.passo{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:13px 0;cursor:pointer;font:inherit;color:inherit;min-height:60px}
.passo:first-of-type{border-top:0}
.passo .pn{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;border:1.5px solid var(--rose);color:var(--rose)}
.passo.ok .pn{background:var(--rose);color:var(--rose-ink);border-color:var(--rose)}
.passo .pt{flex:1;display:flex;flex-direction:column}.passo .pt b{font-weight:600}.passo .pt span{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.passo.ok .pt b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rose)}
.ring{--p:0;width:52px;height:52px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--rose) calc(var(--p)*360deg),var(--line) 0)}
.ring span{width:42px;height:42px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--rose)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:center}
.stats b{display:block;font-family:"Jost",sans-serif;font-weight:400;font-size:28px;color:var(--rose);line-height:1.1}.stats span{font-size:12px;color:var(--muted)}
nav.tabs{grid-template-columns:repeat(4,minmax(0,1fr))}

.cmp{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.cmp span{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.cmp .a{background:color-mix(in srgb,var(--rose) 35%,transparent)}
.cmp .b{background:var(--rose);height:5px;top:auto}
.linha{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:14px}
.marco{position:relative;display:flex;flex-direction:column}
.marco::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--rose);box-shadow:0 0 0 3px var(--bg)}
.marco b{font-weight:500}
.pagina{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px;break-inside:avoid}
.certificado{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 22px;border-radius:28px;background:var(--card);border:1.5px solid var(--gold);box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7px color-mix(in srgb,var(--gold) 50%,transparent)}

/* ===== editorial ===== */
body{font-family:"Inter",system-ui,sans-serif}
h1,.hello,.serif,.titulo,.ct,.sec,.marca,.saud,.brand h1,.stats b{font-family:"Playfair Display",Georgia,serif!important;font-weight:400!important;letter-spacing:-.005em}
h1{font-size:30px}.hello{font-size:34px;line-height:1.1;margin:0}
.sec{font-size:21px}
.lbl,.eyebrow{font-family:"Inter",sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:11px!important;font-weight:500;color:var(--muted)!important;margin:0}
.btn{background:var(--rose)!important;box-shadow:none!important;border-radius:999px;font-weight:500;letter-spacing:.01em}
.btn.soft{background:var(--rose-soft)!important;color:var(--rose)}
.btn.line{background:transparent!important;border:1px solid var(--rose);color:var(--rose)}
.card,.item,.tile,.stats div{border:1px solid var(--line);box-shadow:0 1px 2px var(--shadow)!important;border-radius:22px}
.item.soft{background:var(--rose-soft);border-color:transparent}
.hero{background:var(--rose-soft)!important;box-shadow:none!important;border:1px solid color-mix(in srgb,var(--rose) 14%,transparent)}
.hero .arch{color:var(--gold)!important;opacity:.35}
.block.rose,.block.champ{border:1px solid color-mix(in srgb,var(--rose) 12%,transparent)}
.ico,.qi{background:var(--rose-soft);color:var(--rose)}
.avatar{background:var(--rose-soft)!important;color:var(--rose);box-shadow:0 0 0 2px var(--card),0 0 0 3px var(--gold)!important;font-family:"Playfair Display",serif;font-weight:500}
.avatar.sm{width:38px;height:38px;font-size:15px}
.topbar{position:sticky;top:0;z-index:4;display:flex;align-items:center;justify-content:space-between;margin:-28px -20px 18px;padding:12px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.marca{font-size:20px;color:var(--ink);margin:0}
.iconbtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--rose);font:inherit;font-weight:500;font-size:14px;cursor:pointer}
.blush{background:var(--rose-soft);border:1px solid color-mix(in srgb,var(--rose) 14%,transparent);border-radius:24px;padding:20px}
.blush .bar{background:color-mix(in srgb,var(--card) 70%,transparent)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px}
.wd span{font-size:12px;color:var(--muted);font-weight:500}
.wd i{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--rose-ink)}
.wd.ok i{background:var(--rose);border-color:var(--rose)}
.wd.hj i{border:2px solid var(--rose)}.wd.hj span{color:var(--rose)}
.fotocard{display:block;width:100%;padding:0;text-align:left;border:1px solid var(--line);border-radius:24px;overflow:hidden;background:var(--card);cursor:pointer;font:inherit;color:inherit;box-shadow:0 1px 2px var(--shadow)}
.fotocard .arte{display:block;width:100%;height:150px}
.fotocard .fc{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px}
.qgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:118px;cursor:pointer;font:inherit;color:inherit;box-shadow:0 1px 2px var(--shadow)}
.qbtn .qi{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.qbtn .qi svg.i{width:18px;height:18px}
.qbtn b{font-weight:600;font-size:14.5px;line-height:1.25}
.qbtn span:not(.qi){font-size:12.5px;color:var(--muted);line-height:1.35}
.qbtn.mini{min-height:110px}.qbtn em{font-style:normal;font-size:11px;color:var(--muted);margin-top:auto}
.qbtn em::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--sage);margin-right:6px;vertical-align:1px}
#drawer{position:fixed;inset:0;z-index:30;background:rgba(30,20,18,.35);display:none}
#drawer.on{display:block}
.dpanel{width:min(320px,84%);height:100%;overflow:auto;background:var(--bg);padding:22px 16px 30px;display:flex;flex-direction:column;gap:2px;animation:dentra .25s ease}
@keyframes dentra{from{transform:translateX(-30px);opacity:0}}
.dtop{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.dpanel .lbl{padding:16px 10px 6px}
.dlink{display:flex;align-items:center;gap:14px;width:100%;min-height:46px;padding:10px;border:0;border-radius:14px;background:none;color:var(--ink);font:inherit;font-size:15px;text-align:left;cursor:pointer}
.dlink svg.i{width:20px;height:20px;color:var(--rose)}
.dlink.on{background:var(--rose-soft);color:var(--rose);font-weight:500}
nav.tabs{grid-template-columns:repeat(5,minmax(0,1fr))!important;border-radius:26px;overflow:visible}
nav.tabs a{font-size:10.5px}
nav.tabs a.on{background:transparent!important;color:var(--rose)}
nav.tabs .centro{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;border:0;background:none;color:var(--rose);font:inherit;font-size:10.5px;font-weight:600;cursor:pointer;padding:0 0 8px}
nav.tabs .centro span{width:54px;height:54px;margin-top:-26px;border-radius:50%;background:var(--rose);color:var(--rose-ink);display:flex;align-items:center;justify-content:center;border:4px solid var(--bg);box-shadow:0 8px 20px var(--shadow)}
.c-vinho{background:#8A5E54!important}
@media(prefers-reduced-motion:reduce){.dpanel{animation:none}}
@media print{.topbar,nav.tabs,.noprint,.demo,.toast{display:none!important}body{background:#fff;color:#000}.app{max-width:none;padding:0}}
</style>
